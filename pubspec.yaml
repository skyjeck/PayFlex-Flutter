name: payflex
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  shared_preferences: ^2.5.5
  intl: ^0.20.3
  image_picker: ^1.2.3
  share_plus: ^9.0.0
  image_gallery_saver: ^2.0.3
  path_provider: ^2.1.5
  permission_handler: ^11.3.0
  csv: ^5.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_native_splash: ^2.4.1
  flutter_lints: ^6.0.0

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/logo/payflex.png
  color_dark: "#FFFFFF"
  image_dark: assets/logo/payflex.png
  android_12:
    image: assets/logo/payflex.png
    icon_background_color: "#FFFFFF"
  fullscreen: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/